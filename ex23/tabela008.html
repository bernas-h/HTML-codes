<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício de Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 500px;
            border-collapse: collapse;
        }
        caption{
            font-size: 1.3em;
            font-weight: bolder;
            padding: 8px;
        }
        th, td{
            border: 1px solid black;
            padding: 10px;
        }
        col.cnome{
            background-color: #26ec0b;
        }
        col.csexo{
            background-color: yellow;
        }
        .vermelho{
            background-color: red;
        }
    </style>
</head>
<body>
    <h1>Exercicio de Tabela</h1>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo" span="2">
            <col class="vermelho">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="">Nome</th>
            <th scope="">Sexo</th>
            <th scope="">Idade</th>
            <th scope="">Profissão</th>
        </tr>
        <tr>
            <td>Ana Maria</td>
            <td>Feminino</td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>
        <tr>
            <td>João Carlos</td>
            <td>Masculino</td>
            <td>30</td>
            <td>Engenheiro</td>
        </tr>
        <tr>
            <td>Maria Clara</td>
            <td>Feminino</td>
            <td>28</td>
            <td>Designer</td>
        </tr>
        <tr>
            <td>Lucas Silva</td>
            <td>Masculino</td>
            <td>22</td>
            <td>Estudante</td>
        </tr>
        <tr>
            <td>Fernanda Lima</td>
            <td>Feminino</td>
            <td>35</td>
            <td>Arquiteta</td>
        </tr>
        <tr>
            <td>Mariana Costa</td>
            <td>Feminino</td>
            <td>27</td>
            <td>Desenvolvedora</td>
        </tr>

    </table>
</body>
</html>
